<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzuCafe Web Site</title>
    <link rel="icon" href="img/icon.png" type="image/x-icon">
    <link rel="stylesheet" href="css/home-styles.css">
    <link rel="stylesheet" href="css/navbar-styles.css">
    <link rel="stylesheet" href="css/footer-styles.css">
</head>
<body>
    <div id="navbar"></div>
    <main id="content" class="content-section slide-in"></main>
    <div id="footer"></div>

    <script src="javascript/utils.js"></script>
    <script src="javascript/components.js"></script>
    <script src="javascript/navbar.js"></script>
    <script src="javascript/home.js"></script>
    <script src="javascript/footer.js"></script>
    <script src="javascript/history.js"></script>
    <script src="javascript/blog.js"></script>
    <script src="javascript/shop.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            
            loadComponentWithAnimation('navbar', 'html/navbar.html');

            const hash = window.location.hash;
            if (hash) {
                const target = hash.replace('#', '');
                loadComponentWithAnimation('content', `html/${target}.html`);
            } else {
                loadComponentWithAnimation('content', 'html/home.html');
            }

            loadComponentWithAnimation('footer', 'html/footer.html');
            setMarqueeSpeed(20);
        });

        function setMarqueeSpeed(speed) {
            const marquee = document.querySelector('.marquee');
            if (marquee) {
                marquee.style.animationDuration = `${speed}s`;
            }
        }
    </script>
</body>
</html>
