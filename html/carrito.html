<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compra</title>
    <link rel="stylesheet" href="../css/shop-styles.css">
    <link rel="stylesheet" href="../css/compra-styles.css">
    <link rel="stylesheet" href="../css/carrito-style.css">
</head>
<body>
    <nav id="navbar"></nav>
    <a href="shop.html" class="back-link">
        <span class="back-arrow">&#8592;</span> Volver a la tienda
    </a>
    <h1 class="shop-title">Detalle del Producto</h1>
    <div class="carrito-container" id="carrito-container">
        <!-- Aquí se carga el producto dinámicamente -->
    </div>
    <script src="../javascript/navbar.js"></script>
    <script>
        // Carga dinámica del navbar si tienes un componente HTML para él
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof loadComponentWithAnimation === 'function') {
                loadComponentWithAnimation('navbar', 'components/navbar.html');
            }
        });
    </script>
    <script src="../javascript/carrito.js"></script>
</body>
</html>
