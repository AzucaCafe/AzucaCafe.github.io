<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Interactiva</title>
    <link rel="stylesheet" href="../css/shop-styles.css">
    <link rel="stylesheet" href="../css/compra-styles.css">
</head>
<body>
    <h1 class="shop-title">Nuestros Productos</h1>
    <div class="shop-container">
        <!-- Granos de Café -->
        <div class="product-card" data-product="Bolsa de Granos de Café">
            <img src="../img/shop/grano/100.png" alt="Granos de café" class="product-image">
            <h3>Bolsa de Granos de Café</h3>
            <p>Selecciona la presentación y cantidad deseada</p>
            <select class="product-select size-select">
                <option value="100g">100g</option>
                <option value="125g">125g</option>
                <option value="250g">250g</option>
                <option value="340g">340g</option>
                <option value="500g">500g</option>
                <option value="2500g">2500g</option>
            </select>
            <select class="product-select quantity-select">
                <option value="1">1 unidad</option>
                <option value="2">2 unidades</option>
                <option value="3">3 unidades</option>
                <option value="4">4 unidades</option>
                <option value="5">5 unidades</option>
                 <option value="6">6 unidad</option>
                <option value="7">7 unidades</option>
                <option value="8">8 unidades</option>
                <option value="9">9 unidades</option>
                <option value="10">10 unidades</option>
            </select>
            <div class="price">$0</div> <!-- Valor inicial visible, el JS lo actualizará -->
            <div class="button-container">
                <button class="view-button">Ver Producto</button>
                <a class="buy-button" target="_blank" href="">
                    <button class="buy-button">Comprar Ahora</button>
                </a>
            </div>
        </div>

        <!-- Café Molido -->
        <div class="product-card" data-product="Bolsa de Café Molido">
            <img src="../img/shop/molido/100.png" alt="Café molido" class="product-image">
            <h3>Bolsa de Café Molido</h3>
            <p>Selecciona la presentación y cantidad deseada</p>
            <select class="product-select size-select">
                <option value="100g">100g</option>
                <option value="125g">125g</option>
                <option value="250g">250g</option>
                <option value="340g">340g</option>
                <option value="500g">500g</option>
                <option value="2500g">2500g</option>
            </select>
            <select class="product-select quantity-select">
                <option value="1">1 unidad</option>
                <option value="2">2 unidades</option>
                <option value="3">3 unidades</option>
                <option value="4">4 unidades</option>
                <option value="5">5 unidades</option>
                <option value="6">6 unidad</option>
                <option value="7">7 unidades</option>
                <option value="8">8 unidades</option>
                <option value="9">9 unidades</option>
                <option value="10">10 unidades</option>
            </select>
            <div class="price">$0</div> <!-- Valor inicial visible, el JS lo actualizará -->
            <div class="button-container">
                <button class="view-button">Ver Producto</button>
                <a class="buy-button" target="_blank" href="">
                    <button class="buy-button">Comprar Ahora</button>
                </a>
            </div>
        </div>

        <!-- Té de cáscara de café -->
        <div class="product-card" data-product="Bolsa de Té de Cáscara de Café Fermentado">
            <img src="../img/shop/te.png" alt="Té" class="product-image">
            <h3>Bolsa de Té de Cáscara de Café Fermentado</h3>
            <p>Solo disponible en 100g</p>
            <select class="product-select size-select">
                <option value="100g">100g</option>
            </select>
            <select class="product-select quantity-select">
                <option value="1">1 unidad</option>
                <option value="2">2 unidades</option>
                <option value="3">3 unidades</option>
                <option value="4">4 unidades</option>
                <option value="5">5 unidades</option>
            </select>
            <div class="price">$0</div> <!-- Valor inicial visible, el JS lo actualizará -->
            <div class="button-container">
                <button class="view-button">Ver Producto</button>
                <a class="buy-button" target="_blank" href="">
                    <button class="buy-button">Comprar Ahora</button>
                </a>
            </div>
        </div>
    </div>
    <script>
        if (window.initializeShop) window.initializeShop();
    </script>
</body>
</html>
